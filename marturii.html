<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mărturii | Suflet Mic</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#f4f6f9;
color:#1f2937;
opacity:0;
transition:opacity 0.8s ease;
}

body.loaded{
opacity:1;
}

header{
background:linear-gradient(135deg,#1b4332,#2d6a4f);
color:white;
padding:60px 20px;
text-align:center;
}

nav{
margin-top:20px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:14px;
position:relative;
}

nav a::after{
content:"";
position:absolute;
bottom:-5px;
left:50%;
width:0;
height:2px;
background:white;
transform:translateX(-50%);
transition:0.4s ease;
}

nav a:hover::after{
width:100%;
}

section{
max-width:900px;
margin:80px auto;
padding:0 20px;
}

.card{
background:white;
padding:50px;
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,0.08);
}

h2{
color:#2d6a4f;
margin-bottom:20px;
}

p{
line-height:1.8;
margin-bottom:15px;
}

.disclaimer{
margin-bottom:40px;
padding:20px;
background:#f8fafc;
border-left:5px solid #2d6a4f;
border-radius:12px;
font-size:14px;
}

footer{
background:#111827;
color:#9ca3af;
text-align:center;
padding:25px;
margin-top:80px;
font-size:14px;
}
</style>
</head>

<body>

<header>
<h1>Mărturii & Păreri</h1>
<nav>
<a href="index.html">Comunitate</a>
<a href="poveste.html">Despre noi</a>
<a href="marturii.html">Mărturii</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<section>

<div class="card">

<h2>Spune-ți părerea</h2>

<div class="disclaimer">
Te rugăm să păstrezi un limbaj respectuos. Comentariile jignitoare sau nepotrivite vor fi șterse pentru a menține un spațiu sigur pentru toți.
</div>

</section>

</footer>

<script>
document.addEventListener("DOMContentLoaded", function() {
document.body.classList.add("loaded");

document.querySelectorAll("a").forEach(link=>{
link.addEventListener("click",function(e){
if(this.href.includes(".html")){
e.preventDefault();
document.body.style.opacity="0";
setTimeout(()=>{window.location=this.href;},600);
}
});
});
});
</script>
