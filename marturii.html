<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:#f3f4f6;color:#1f2937;}
header{background:linear-gradient(135deg,#1b4332,#2d6a4f);color:white;padding:80px 20px;text-align:center;}
.logo{display:flex;justify-content:center;align-items:center;gap:12px;font-size:28px;font-weight:600;}
.logo svg{width:42px;height:42px;}
nav{margin-top:35px;}
nav a{color:white;text-decoration:none;margin:0 15px;font-weight:500;position:relative;}
nav a::after{content:'';display:block;height:2px;width:0%;background:white;transition:0.3s;margin:auto;}
nav a:hover::after{width:100%;}
section{max-width:1100px;margin:80px auto;padding:0 20px;animation:fadeIn 1s ease;}
.card{background:white;padding:50px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,0.08);}
h2{font-size:32px;margin-bottom:25px;color:#2d6a4f;}
footer{background:#111827;color:#9ca3af;text-align:center;padding:30px;margin-top:100px;font-size:14px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:768px){nav a{display:block;margin:12px 0;}.card{padding:30px;}h2{font-size:24px;}}
</style>
</head>

<section>
<div class="card">
<h2>Mărturii</h2>

<p><strong>Ana:</strong> „Pentru prima dată m-am simțit ascultată fără să fiu judecată.”</p>
<br>
<p><strong>Mihai:</strong> „Mi-a oferit speranță într-un moment critic.”</p>
<br>
<p><strong>Maria:</strong> „Un loc sigur unde am găsit liniște.”</p>

<br><br>

<h2>Lasă o părere 💚</h2>

<form id="commentForm" style="margin-top:20px;">

<input type="text" id="name" placeholder="Numele tău" required
style="width:100%;padding:12px;margin-bottom:15px;border-radius:10px;border:1px solid #d1d5db;font-family:Poppins;">

<textarea id="message" placeholder="Scrie părerea ta..." required
style="width:100%;padding:12px;height:120px;margin-bottom:15px;border-radius:10px;border:1px solid #d1d5db;font-family:Poppins;"></textarea>

<button type="submit"
style="background:#2d6a4f;color:white;padding:12px 25px;border:none;border-radius:10px;cursor:pointer;font-weight:600;">
Trimite
</button>

</form>

<div id="thankYouMessage" style="margin-top:15px;color:#2d6a4f;font-weight:500;"></div>

<script>
document.getElementById("commentForm").addEventListener("submit", function(e){
e.preventDefault();
document.getElementById("thankYouMessage").innerHTML = 
"💚 Mulțumim pentru mesaj! Comentariul tău va fi adăugat în curând.";
this.reset();
});
</script>

</div>
</section>

<footer>

</footer>

</body>
