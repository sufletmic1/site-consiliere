<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Înțelegere</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: #f8f9fb;
    color: #2e2e2e;
    line-height: 1.8;
}

section {
    max-width: 800px;
    margin: 80px auto;
    padding: 0 20px;
}

.block {
    background: white;
    padding: 60px 50px;
    margin-bottom: 60px;
    border-radius: 18px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.04);
    transition: 0.3s ease;
}

.block:hover {
    transform: translateY(-4px);
    box-shadow: 0 25px 60px rgba(0,0,0,0.06);
}

h2 {
    font-weight: 500;
    font-size: 26px;
    margin-bottom: 30px;
    color: #1f1f1f;
}

p {
    margin-bottom: 20px;
    font-size: 17px;
    color: #444;
}

.encourage {
    margin-top: 35px;
    padding: 25px 30px;
    background: #f3f6ff;
    border-left: 4px solid #a5b4fc;
    border-radius: 12px;
    font-weight: 500;
    color: #3f3f55;
}

.button-row {
    margin-top: 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.back {
    text-decoration: none;
    color: #888;
    font-size: 14px;
    transition: 0.2s;
}

.back:hover {
    color: #555;
}

.write {
    text-decoration: none;
    background: #6366f1;
    color: white;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 14px;
    transition: 0.2s;
}

.write:hover {
    background: #4f46e5;
    transform: translateY(-2px);
}

@media (max-width: 768px) {

    .block {
        padding: 40px 25px;
    }

    h2 {
        font-size: 22px;
    }

    p {
        font-size: 16px;
    }

}

</style>
</head>

<body>

<section>

<!-- AICI PUI TOATE BLOCK-URILE TALE EXACT CUM LE-AM SCRIS -->

</section>

</body>
</html>
