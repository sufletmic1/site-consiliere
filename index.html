<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suflet Mic | Comunitate</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#f3f4f6;
color:#1f2937;
opacity:0;
transition:opacity 0.6s ease;
}

body.loaded{
opacity:1;
}

/* HEADER */
header{
background:linear-gradient(135deg,#1b4332,#2d6a4f);
color:white;
padding:60px 20px;
text-align:center;
}

/* LOGO */
.logo{
width:70px;
margin:0 auto 15px;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-6px);}
}

/* MENIU */
nav{
display:flex;
flex-direction:column;
align-items:center;
margin-top:25px;
}

nav a{
color:white;
text-decoration:none;
padding:12px 0;
width:100%;
text-align:center;
font-size:14px;
letter-spacing:1px;
position:relative;
overflow:hidden;
}

/* LINIE FULL WIDTH DIN MIJLOC */
nav a::after{
content:"";
position:absolute;
bottom:0;
left:50%;
height:2px;
width:0%;
background:white;
transform:translateX(-50%);
transition:width 0.4s ease;
}

nav a:hover::after{
width:100%;
}

/* CONTENT */
section{
max-width:900px;
margin:80px auto;
padding:0 20px;
}

.card{
background:white;
padding:50px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,0.08);
opacity:0;
transform:translateY(30px);
animation:fadeUp 1s ease forwards;
}

@keyframes fadeUp{
to{
opacity:1;
transform:translateY(0);
}
}

footer{
background:#111827;
color:#9ca3af;
text-align:center;
padding:25px;
margin-top:80px;
}
</style>
</head>

<body>

<header>

<svg class="logo" viewBox="0 0 100 100" fill="white">
<path d="M50 90s-35-20-35-45a20 20 0 0 1 35-10 20 20 0 0 1 35 10c0 25-35 45-35 45z"/>
</svg>

<h1>Suflet Mic</h1>

<nav>
<a href="index.html">Comunitate</a>
<a href="poveste.html">Despre noi</a>
<a href="marturii.html">Mărturii</a>
<a href="contact.html">Contact</a>
</nav>

</header>

<section>
<div class="card">
<h2>Comunitatea noastră</h2>
<p>Suntem un spațiu sigur pentru sufletele care au nevoie să fie ascultate.
Aici construim sprijin, empatie și conexiune reală.</p>
</div>
</section>

<footer>
© 2026 Suflet Mic
</footer>

<script>
document.addEventListener("DOMContentLoaded", function() {
document.body.classList.add("loaded");

document.querySelectorAll("a").forEach(link=>{
link.addEventListener("click",function(e){
if(this.href.includes(".html")){
e.preventDefault();
document.body.style.opacity="0";
setTimeout(()=>{window.location=this.href;},400);
}
});
});
});
</script>

</body>
</html>
