<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suflet Mic | Contact</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:#f3f4f6;
color:#1f2937;
opacity:0;
transition:opacity 0.8s ease;
}

body.fade-in{
opacity:1;
}

/* HEADER */
header{
background:linear-gradient(135deg,#1b4332,#2d6a4f);
color:white;
padding:80px 20px;
text-align:center;
}

/* MENIU VERTICAL IDENTIC */
nav{
margin-top:30px;
display:flex;
flex-direction:column;
align-items:center;
gap:15px;
}

nav a{
color:white;
text-decoration:none;
font-weight:500;
position:relative;
padding-bottom:5px;
}

/* Linie animată */
nav a::after{
content:"";
position:absolute;
width:0%;
height:2px;
background:white;
left:0;
bottom:0;
transition:0.3s;
}

nav a:hover::after{
width:100%;
}

/* Evidențiere pagină activă */
nav a.active::after{
width:100%;
}

/* SECTIUNE */
section{
max-width:700px;
margin:80px auto;
padding:0 20px;
}

.card{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,0.08);
transform:translateY(40px);
opacity:0;
animation:slideUp 1s ease forwards;
}

@keyframes slideUp{
to{
transform:translateY(0);
opacity:1;
}
}

h2{
margin-bottom:20px;
color:#2d6a4f;
}

/* FORMULAR */
input, textarea{
width:100%;
padding:15px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
font-family:'Poppins',sans-serif;
transition:0.3s;
}

input:focus, textarea:focus{
border-color:#2d6a4f;
outline:none;
}

button{
padding:15px;
border:none;
background:#2d6a4f;
color:white;
border-radius:30px;
font-weight:600;
cursor:pointer;
transition:0.3s;
width:100%;
}

button:hover{
background:#1b4332;
transform:scale(1.03);
}

.success-message{
display:none;
margin-top:20px;
padding:15px;
background:#d8f3dc;
color:#1b4332;
border-radius:10px;
text-align:center;
font-weight:500;
}

/* SOCIAL */
.social{
margin-top:40px;
text-align:center;
opacity:0;
animation:fadeIn 1.5s ease forwards;
animation-delay:0.5s;
}

@keyframes fadeIn{
to{opacity:1;}
}

.social a{
display:inline-block;
margin:10px;
padding:10px 20px;
background:#52b788;
color:white;
text-decoration:none;
border-radius:25px;
transition:0.3s;
}

.social a:hover{
background:#1b4332;
transform:translateY(-3px);
}

/* FOOTER */
footer{
background:#111827;
color:#9ca3af;
text-align:center;
padding:25px;
margin-top:80px;
font-size:14px;
}
</style>
</head>

<body>

<header>
<h1>Suflet Mic</h1>
<nav>
<a href="index.html">Comunitate</a>
<a href="poveste.html">Despre noi</a>
<a href="marturii.html">Mărturii</a>
<a href="contact.html" class="active">Contact</a>
</nav>
</header>

<section>
<div class="card">

<h2>Trimite-ne un mesaj</h2>

<form id="contact-form">
<input type="text" name="name" placeholder="Numele tău" required>
<input type="email" name="email" placeholder="Emailul tău" required>
<textarea name="message" placeholder="Scrie mesajul tău..." rows="5" required></textarea>
<button type="submit">Trimite mesajul</button>
</form>

<div class="success-message" id="success-msg">
Mesajul a fost trimis cu succes 🤍 Îți vom răspunde cât mai curând.
</div>

<div class="social">
<h2>Ne găsești și aici</h2>
<a href="https://t.me/sufletmiccareteasculta" target="_blank">Telegram</a>
<a href="http://www.tiktok.com/@suflet.mic14" target="_blank">TikTok</a>
<a href="https://www.instagram.com/un_suflet_mic_care_te_asculta" target="_blank">Instagram</a>
<a href="https://www.facebook.com/share/1GVwoEyhzU/?mibextid=wwXIfr" target="_blank">Facebook</a>
</div>

</div>
</section>

<footer>
© 2026 Suflet Mic
</footer>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
document.body.classList.add("fade-in");
});

(function(){
emailjs.init("_IVe9Vmte22ka5wMm");
})();

document.getElementById("contact-form").addEventListener("submit", function(e) {
e.preventDefault();

emailjs.sendForm(
"service_s6qhej9",
"template_b9xtxlc",
this
).then(function() {
document.getElementById("success-msg").style.display = "block";
document.getElementById("contact-form").reset();
}, function(error) {
alert("Eroare la trimitere.");
console.log(error);
});
});
</script>

</body>
</html>
