<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suflet Mic | Contact</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:#f3f4f6;
color:#1f2937;
opacity:0;
transition:opacity 0.6s ease;
overflow-x:hidden;
}

body.loaded{
opacity:1;
}

/* HEADER */
header{
background:linear-gradient(135deg,#1b4332,#2d6a4f);
color:white;
padding:60px 20px;
text-align:center;
position:relative;
}

/* LOGO SVG ANIMAT */
.logo{
width:80px;
margin:0 auto 15px;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-8px);}
}

/* MENIU ONG MODERN */
nav{
display:flex;
flex-direction:column;
align-items:center;
margin-top:25px;
position:relative;
}

nav a{
color:white;
text-decoration:none;
padding:12px 0;
width:100%;
text-align:center;
font-weight:500;
position:relative;
}

nav a::after{
content:"";
position:absolute;
left:50%;
bottom:0;
height:2px;
width:0%;
background:white;
transition:0.4s ease;
transform:translateX(-50%);
}

nav a:hover::after{
width:80%;
}

nav a.active::after{
width:80%;
}

/* SECTIUNE */
section{
max-width:700px;
margin:80px auto;
padding:0 20px;
}

.card{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,0.08);
transform:translateY(30px);
opacity:0;
animation:fadeUp 1s ease forwards;
}

@keyframes fadeUp{
to{transform:translateY(0);opacity:1;}
}

h2{
margin-bottom:20px;
color:#2d6a4f;
}

input, textarea{
width:100%;
padding:15px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
transition:0.3s;
}

input:focus, textarea:focus{
border-color:#2d6a4f;
outline:none;
}

button{
padding:15px;
border:none;
background:#2d6a4f;
color:white;
border-radius:30px;
font-weight:600;
cursor:pointer;
transition:0.3s;
width:100%;
}

button:hover{
background:#1b4332;
transform:scale(1.03);
}

.success-message{
display:none;
margin-top:20px;
padding:15px;
background:#d8f3dc;
color:#1b4332;
border-radius:10px;
text-align:center;
}

/* SOCIAL */
.social{
margin-top:40px;
text-align:center;
}

.social a{
display:inline-block;
margin:10px;
padding:10px 20px;
background:#52b788;
color:white;
text-decoration:none;
border-radius:25px;
transition:0.3s;
}

.social a:hover{
background:#1b4332;
transform:translateY(-3px);
}

/* FOOTER */
footer{
background:#111827;
color:#9ca3af;
text-align:center;
padding:25px;
margin-top:80px;
font-size:14px;
}

/* INIMIOARE ANIMATE */
.heart{
position:fixed;
top:40%;
font-size:40px;
opacity:0;
animation:heartAnim 2.5s ease forwards;
z-index:999;
}

.heart.left{left:20px;}
.heart.right{right:20px;}

@keyframes heartAnim{
0%{opacity:0;transform:scale(0.5);}
30%{opacity:1;transform:scale(1.2);}
70%{opacity:1;transform:scale(1);}
100%{opacity:0;transform:scale(0.5);}
}
</style>
</head>

<body>

<div class="heart left">❤️</div>
<div class="heart right">❤️</div>

<header>

<!-- LOGO SVG -->
<svg class="logo" viewBox="0 0 100 100" fill="white">
<path d="M50 90s-35-20-35-45a20 20 0 0 1 35-10 20 20 0 0 1 35 10c0 25-35 45-35 45z"/>
</svg>

<h1>Suflet Mic</h1>

<nav>
<a href="index.html">Comunitate</a>
<a href="poveste.html">Despre noi</a>
<a href="marturii.html">Mărturii</a>
<a href="contact.html" class="active">Contact</a>
</nav>

</header>

<section>
<div class="card">

<h2>Trimite-ne un mesaj</h2>

<form id="contact-form">
<input type="text" name="name" placeholder="Numele tău" required>
<input type="email" name="email" placeholder="Emailul tău" required>
<textarea name="message" placeholder="Scrie mesajul tău..." rows="5" required></textarea>
<button type="submit">Trimite mesajul</button>
</form>

<div class="success-message" id="success-msg">
Mesajul a fost trimis cu succes 🤍
</div>

<div class="social">
<h2>Ne găsești și aici</h2>
<a href="https://t.me/sufletmiccareteasculta" target="_blank">Telegram</a>
<a href="http://www.tiktok.com/@suflet.mic14" target="_blank">TikTok</a>
</div>

</div>
</section>

<footer>
© 2026 Suflet Mic
</footer>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
document.body.classList.add("loaded");

/* TRanziție între pagini */
document.querySelectorAll("a").forEach(link=>{
link.addEventListener("click",function(e){
if(this.href && this.href.includes(".html")){
e.preventDefault();
document.body.style.opacity="0";
setTimeout(()=>{window.location=this.href;},400);
}
});
});
});

/* EMAILJS */
(function(){
emailjs.init("_IVe9Vmte22ka5wMm");
})();

document.getElementById("contact-form").addEventListener("submit", function(e) {
e.preventDefault();

emailjs.sendForm(
"service_s6qhej9",
"template_b9xtxlc",
this
).then(function() {
document.getElementById("success-msg").style.display="block";
document.getElementById("contact-form").reset();
});
});
</script>

</body>
</html>
