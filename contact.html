<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suflet Mic | Contact</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:#f3f4f6;color:#1f2937;}
header{background:linear-gradient(135deg,#1b4332,#2d6a4f);color:white;padding:80px 20px;text-align:center;}
.logo{display:flex;justify-content:center;align-items:center;gap:12px;font-size:28px;font-weight:600;}
.logo svg{width:42px;height:42px;}
nav{margin-top:35px;}
nav a{color:white;text-decoration:none;margin:0 15px;font-weight:500;position:relative;}
nav a::after{content:'';display:block;height:2px;width:0%;background:white;transition:0.3s;margin:auto;}
nav a:hover::after{width:100%;}
section{max-width:800px;margin:80px auto;padding:0 20px;animation:fadeIn 1s ease;}
.card{background:white;padding:50px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,0.08);}
input,textarea{width:100%;padding:15px;margin-bottom:15px;border-radius:10px;border:1px solid #ccc;}
button{padding:15px 30px;border:none;background:#2d6a4f;color:white;border-radius:30px;font-weight:600;cursor:pointer;}
button:hover{background:#1b4332;}
footer{background:#111827;color:#9ca3af;text-align:center;padding:30px;margin-top:100px;font-size:14px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:768px){nav a{display:block;margin:12px 0;}.card{padding:30px;}}
</style>
</head>

<body>

<header>
<div class="logo">
<svg viewBox="0 0 24 24" fill="white">
<path d="M12 21s-6-4.35-9-8.28C-1.5 7.24 3.24 2 7.5 5.09 9.24 6.39 12 9 12 9s2.76-2.61 4.5-3.91C20.76 2 25.5 7.24 21 12.72 18 16.65 12 21 12 21z"/>
</svg>
Suflet Mic
</div>

<nav>
<a href="index.html">Comunitate</a>
<a href="poveste.html">Despre noi</a>
<a href="marturii.html">Mărturii</a>
<a href="contact.html">Contact</a>
</nav>
</header>

<section>
<div class="card">
<h2>Trimite-ne un mesaj</h2>

<form>
<input type="text" placeholder="Numele tău" required>
<input type="email" placeholder="Emailul tău" required>
<textarea placeholder="Mesajul tău" rows="5" required></textarea>
<button type="submit">Trimite mesaj</button>
</form>

</div>
</section>

<footer>
© 2026 Suflet Mic
</footer>

</body>
</html>
